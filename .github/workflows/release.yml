name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v3.0.0-turkish-food)'
        required: true
        default: 'v3.0.0-turkish-food'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pipeline (Optional Full Build)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          if [ -n "$PEXELS_API_KEY" ]; then
            echo "PEXELS_API_KEY found. Ready for pipeline tasks."
          else
            echo "PEXELS_API_KEY secret is not set."
          fi

      - name: Export Quality Tiers (If Output Exists)
        run: |
          if ls output/*_turkish_foods.mp4 1> /dev/null 2>&1; then
            python export_qualities.py --preset all
          else
            echo "Turkish foods master video not found in workspace (expected for fresh clones)."
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Top 10,000 Turkish Foods Release ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          files: |
            output/turkish-food-50mb.mp4
            output/turkish-food-100mb.mp4
            output/turkish-food-full.mp4
            assets/preview.gif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
